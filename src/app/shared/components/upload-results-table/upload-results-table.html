<section class="overflow-hidden rounded-md border border-slate-200 bg-white shadow-sm">
  <div class="flex items-center justify-between border-b border-slate-200 bg-slate-50 px-4 py-3">
    <h3 class="text-sm font-semibold text-slate-800">{{ title() }}</h3>
    <span class="text-xs text-slate-500">{{ items().length }} file</span>
  </div>

  @if (items().length > 0) {
    <p-table [value]="items()" styleClass="data-table text-sm" [tableStyle]="{ 'min-width': '52rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th>File</th>
          <th>Dimensione</th>
          <th>Stato</th>
          <th>Documento</th>
          <th>Dettaglio</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td class="font-medium text-slate-800">{{ item.fileName }}</td>
          <td class="text-slate-600">{{ fileSize(item.size) }}</td>
          <td>
            <p-tag
              [severity]="statusSeverity(item.status)"
              [value]="statusLabel(item.status)"
            />
          </td>
          <td>{{ documentLabel(item) }}</td>
          <td class="max-w-96 truncate" [title]="documentDetail(item)">
            {{ documentDetail(item) }}
          </td>
        </tr>
      </ng-template>
    </p-table>
  } @else {
    <div class="px-4 py-8 text-center text-sm text-slate-500">
      Coda vuota.
    </div>
  }

  <div class="flex flex-col gap-2 border-t border-slate-200 bg-white px-4 py-3 sm:flex-row sm:items-center sm:justify-end">
    <button
      pButton
      type="button"
      icon="pi pi-trash"
      label="Svuota"
      severity="secondary"
      [disabled]="!hasFiles() || uploading()"
      (click)="clearRequested.emit()"
    ></button>
    <button
      pButton
      type="button"
      icon="pi pi-upload"
      label="Invia"
      [disabled]="!hasFiles()"
      [loading]="uploading()"
      (click)="uploadRequested.emit()"
    ></button>
  </div>
</section>
