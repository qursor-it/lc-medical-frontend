<p-toast />

@if (auth.isAuthenticated()) {
  <div class="min-h-screen bg-[#f4f7f7] lg:grid lg:grid-cols-[15rem_minmax(0,1fr)]">
    <aside
      class="border-b border-slate-200 bg-white lg:flex lg:min-h-screen lg:flex-col lg:border-b-0 lg:border-r"
    >
      <div class="flex h-14 items-center px-4 lg:h-16">
        <a
          routerLink="/dashboard"
          class="flex items-center gap-3 text-sm font-semibold text-slate-950"
        >
          <span
            class="flex h-8 w-8 items-center justify-center rounded-md bg-teal-700 text-xs font-bold text-white"
          >
            LC
          </span>
          LC Medical
        </a>
      </div>

      <nav class="flex gap-2 overflow-x-auto px-3 pb-3 lg:flex-col lg:overflow-visible lg:px-3">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
          title="Dashboard"
          class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
        >
          <i class="pi pi-chart-line"></i>
          <span class="nav-label sr-only sm:not-sr-only">Dashboard</span>
        </a>
        <a
          routerLink="/orders"
          routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
          title="Ordini"
          class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
        >
          <i class="pi pi-list"></i>
          <span class="nav-label sr-only sm:not-sr-only">Ordini</span>
        </a>
        <a
          routerLink="/invoices"
          routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
          title="Fatture"
          class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
        >
          <i class="pi pi-table"></i>
          <span class="nav-label sr-only sm:not-sr-only">Fatture</span>
        </a>
        <a
          routerLink="/payments"
          routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
          title="Pagamenti"
          class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
        >
          <i class="pi pi-credit-card"></i>
          <span class="nav-label sr-only sm:not-sr-only">Pagamenti</span>
        </a>
        <a
          routerLink="/uploads/orders"
          routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
          title="Importa ordini"
          class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
        >
          <i class="pi pi-file-pdf"></i>
          <span class="nav-label sr-only sm:not-sr-only">Importa ordini</span>
        </a>
        <a
          routerLink="/uploads/invoices"
          routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
          title="Importa fatture"
          class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
        >
          <i class="pi pi-receipt"></i>
          <span class="nav-label sr-only sm:not-sr-only">Importa fatture</span>
        </a>
        <a
          routerLink="/uploads/payments"
          routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
          title="Importa pagamenti"
          class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
        >
          <i class="pi pi-file-excel"></i>
          <span class="nav-label sr-only sm:not-sr-only">Importa pagamenti</span>
        </a>
        @if (auth.isAdmin()) {
          <a
            routerLink="/users"
            routerLinkActive="bg-teal-700 text-white hover:bg-teal-700 hover:text-white"
            title="Utenti"
            class="flex min-h-10 items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-teal-50 hover:text-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
          >
            <i class="pi pi-users"></i>
            <span class="nav-label sr-only sm:not-sr-only">Utenti</span>
          </a>
        }
      </nav>

      <div class="mt-auto border-t border-slate-200 p-3">
        <div class="mb-2 min-w-0 px-1 text-xs text-slate-500">
          <p class="truncate font-semibold text-slate-700">{{ auth.currentUser()?.fullName }}</p>
          <p class="truncate">{{ auth.currentUser()?.email }}</p>
        </div>
        <button
          type="button"
          class="flex min-h-10 w-full cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
          (click)="logout()"
        >
          <i class="pi pi-sign-out"></i>
          <span class="nav-label sr-only sm:not-sr-only">Esci</span>
        </button>
      </div>
    </aside>

    <main class="min-w-0 bg-[#f4f7f7]">
      <router-outlet />
    </main>
  </div>
} @else {
  <main class="min-h-screen bg-[#f4f7f7]">
    <router-outlet />
  </main>
}
