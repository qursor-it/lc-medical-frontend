<section class="border-b border-slate-200 bg-white">
  <div
    class="mx-auto flex w-full max-w-7xl flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-5 lg:px-8"
  >
    <div>
      <h1 class="text-xl font-semibold leading-tight text-slate-950">Utenti</h1>
      <p class="mt-0.5 text-sm text-slate-500">{{ users().length }} account</p>
    </div>

    <button
      pButton
      type="button"
      icon="pi pi-refresh"
      label="Aggiorna"
      severity="secondary"
      [loading]="loading()"
      (click)="loadUsers()"
    ></button>
  </div>
</section>

<section
  class="mx-auto grid w-full max-w-7xl gap-5 px-5 py-4 lg:grid-cols-[24rem_minmax(0,1fr)] lg:px-8"
>
  <form
    class="h-fit rounded-md border border-slate-200 bg-white p-4 shadow-sm"
    (submit)="$event.preventDefault(); createUser()"
  >
    <h2 class="text-base font-semibold text-slate-950">Nuovo utente</h2>

    <div class="mt-4 space-y-3">
      <div>
        <label class="text-sm font-medium text-slate-700" for="user-full-name">Nome</label>
        <input
          id="user-full-name"
          type="text"
          class="mt-1 h-10 w-full rounded-md border border-slate-300 px-3 text-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
          [value]="fullName()"
          [disabled]="saving()"
          (input)="updateFullName($event)"
        />
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700" for="user-email">Email</label>
        <input
          id="user-email"
          type="email"
          class="mt-1 h-10 w-full rounded-md border border-slate-300 px-3 text-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
          [value]="email()"
          [disabled]="saving()"
          (input)="updateEmail($event)"
        />
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700" for="user-password">Password</label>
        <input
          id="user-password"
          type="password"
          class="mt-1 h-10 w-full rounded-md border border-slate-300 px-3 text-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
          [value]="password()"
          [disabled]="saving()"
          (input)="updatePassword($event)"
        />
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700" for="user-role">Ruolo</label>
        <select
          id="user-role"
          class="mt-1 h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
          [value]="role()"
          [disabled]="saving()"
          (change)="updateRole($event)"
        >
          <option value="USER">Utente</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
    </div>

    <button
      pButton
      type="submit"
      icon="pi pi-user-plus"
      label="Crea"
      class="mt-4 w-full"
      [loading]="saving()"
    ></button>
  </form>

  <section class="overflow-hidden rounded-md border border-slate-200 bg-white shadow-sm">
    <div class="border-b border-slate-200 bg-slate-50 px-4 py-3">
      <h2 class="text-base font-semibold text-slate-950">Account applicazione</h2>
    </div>

    <p-table
      [value]="users()"
      styleClass="data-table pretty-table mobile-card-table text-sm"
      [tableStyle]="{ 'min-width': '48rem' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Utente</th>
          <th>Ruolo</th>
          <th>Stato</th>
          <th class="text-right">Azioni</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user>
        <tr>
          <td class="mobile-card-primary">
            <div class="min-w-0">
              <p class="cell-clip font-semibold text-slate-950">{{ user.fullName }}</p>
              <p class="cell-clip text-xs text-slate-500">{{ user.email }}</p>
            </div>
          </td>
          <td data-label="Ruolo">
            <select
              class="h-9 rounded-md border border-slate-300 bg-white px-2 text-sm outline-none transition focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
              [value]="user.role"
              (change)="changeRole(user, $event)"
            >
              <option value="USER">Utente</option>
              <option value="ADMIN">Admin</option>
            </select>
          </td>
          <td data-label="Stato">
            <p-tag
              [severity]="user.active ? 'success' : 'secondary'"
              [value]="user.active ? 'Attivo' : 'Disattivo'"
            />
          </td>
          <td data-label="Azioni" class="mobile-card-actions text-right">
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              label="Elimina"
              severity="danger"
              size="small"
              [disabled]="user.id === auth.currentUser()?.id"
              (click)="deleteUser(user)"
            ></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="py-10 text-center text-sm text-slate-500">
            Nessun utente disponibile.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</section>
