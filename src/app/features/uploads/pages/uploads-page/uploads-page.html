<section class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-3 px-5 py-3 md:flex-row md:items-center md:justify-between lg:px-8">
    <div class="space-y-1">
      <p class="text-xs font-semibold uppercase tracking-[0.08em] text-teal-700">Upload PDF</p>
      <h1 class="text-2xl font-semibold leading-tight text-slate-950">
        {{ config().title }}
      </h1>
      <p class="max-w-3xl text-sm leading-5 text-slate-600">
        Carica piu PDF in una sola operazione. Il backend processa ogni file e restituisce un esito separato.
      </p>
    </div>

    <div class="grid grid-cols-2 gap-2 text-sm">
      <div class="rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
        <p class="text-xs text-slate-500">Salvati</p>
        <p class="text-xl font-semibold text-slate-950">{{ successfulUploads() }}</p>
      </div>
      <div class="rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
        <p class="text-xs text-slate-500">Errori</p>
        <p class="text-xl font-semibold text-slate-950">{{ failedUploads() }}</p>
      </div>
    </div>
  </div>
</section>

<section class="mx-auto flex w-full max-w-7xl flex-col gap-5 px-5 py-4 lg:px-8">
  <app-document-upload-panel
    [config]="config()"
    [files]="selectedFiles()"
    [uploading]="uploading()"
    (selectedFilesChanged)="updateSelectedFiles($event)"
  />

  <app-upload-results-table
    [title]="kind() === 'orders' ? 'File ordini da caricare' : 'File invoice da caricare'"
    [items]="uploadQueue()"
    [uploading]="uploading()"
    (clearRequested)="clearSelectedFiles()"
    (uploadRequested)="uploadSelectedFiles()"
  />
</section>
