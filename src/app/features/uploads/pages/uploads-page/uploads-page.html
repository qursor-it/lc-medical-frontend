<section class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-5 px-5 py-6 md:flex-row md:items-end md:justify-between lg:px-8">
    <div class="space-y-2">
      <p class="text-sm font-semibold uppercase tracking-[0.08em] text-teal-700">Upload PDF</p>
      <h1 class="text-3xl font-semibold leading-tight text-slate-950 md:text-4xl">
        {{ config().title }}
      </h1>
      <p class="max-w-3xl text-sm leading-6 text-slate-600 md:text-base">
        Carica piu PDF in una sola operazione. Il backend processa ogni file e restituisce un esito separato.
      </p>
    </div>

    <div class="grid grid-cols-2 gap-3 text-sm">
      <div class="rounded-md border border-slate-200 bg-slate-50 px-4 py-3">
        <p class="text-slate-500">Salvati</p>
        <p class="mt-1 text-2xl font-semibold text-slate-950">{{ successfulUploads() }}</p>
      </div>
      <div class="rounded-md border border-slate-200 bg-slate-50 px-4 py-3">
        <p class="text-slate-500">Errori</p>
        <p class="mt-1 text-2xl font-semibold text-slate-950">{{ failedUploads() }}</p>
      </div>
    </div>
  </div>
</section>

<section class="mx-auto grid w-full max-w-7xl gap-5 px-5 py-6 xl:grid-cols-[minmax(0,0.9fr)_minmax(0,1.1fr)] lg:px-8">
  <app-document-upload-panel
    [config]="config()"
    [uploading]="uploading()"
    (uploadRequested)="upload($event)"
  />

  <app-upload-results-table
    [title]="kind() === 'orders' ? 'Risultati ordini' : 'Risultati invoice'"
    [results]="results()"
  />
</section>
