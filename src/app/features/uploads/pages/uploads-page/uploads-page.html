<section class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex w-full flex-col items-start justify-between gap-3 px-5 py-3 sm:flex-row sm:items-center lg:px-8">
    <div>
      <h1 class="text-2xl font-semibold leading-tight text-slate-950">
        Importa {{ config().title.toLowerCase() }}
      </h1>
    </div>

    <div class="grid w-full grid-cols-2 gap-2 text-sm sm:w-auto">
      <div class="rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
        <p class="text-xs text-slate-500">Salvati</p>
        <p class="text-xl font-semibold text-slate-950">{{ successfulUploads() }}</p>
      </div>
      <div class="rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
        <p class="text-xs text-slate-500">Errori</p>
        <p class="text-xl font-semibold text-slate-950">{{ failedUploads() }}</p>
      </div>
    </div>
  </div>
</section>

<section class="mx-auto flex w-full flex-col gap-5 px-5 py-4 lg:px-8">
  <app-document-upload-panel
    [config]="config()"
    [files]="selectedFiles()"
    [uploading]="uploading()"
    (selectedFilesChanged)="updateSelectedFiles($event)"
  />

  <app-upload-results-table
    title="Coda"
    [items]="uploadQueue()"
    [uploading]="uploading()"
    (clearRequested)="clearSelectedFiles()"
    (uploadRequested)="uploadSelectedFiles()"
  />
</section>
